name: Update Current Affairs

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_current_affairs.py"
      - "data/current_affairs.json"
      - ".github/workflows/update-current-affairs.yml"
  schedule:
    # GitHub Actions cron uses UTC. Runs at 00:00, 06:00, 12:00, and 18:00 UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-affairs-json-update
  cancel-in-progress: false

jobs:
  update-current-affairs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Playwright browser for resolving article links
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate Python syntax
        run: python -m py_compile scripts/update_current_affairs.py

      - name: Fetch RSS feeds and write JSON
        run: python scripts/update_current_affairs.py

      - name: Commit updated JSON when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_affairs.json
          if git diff --cached --quiet; then
            echo "Current Affairs JSON is already up to date."
          else
            git commit -m "Update Current Affairs JSON"
            git push
          fi
