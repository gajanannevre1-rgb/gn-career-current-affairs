name: Update Current Affairs

on:
  schedule:
    # GitHub Actions cron uses UTC. Runs at 00:00, 06:00, 12:00, and 18:00 UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-affairs-json-update
  cancel-in-progress: false

jobs:
  update-current-affairs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch RSS feeds and write JSON
        run: python scripts/update_current_affairs.py

      - name: Commit updated JSON when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_affairs.json
          if git diff --cached --quiet; then
            echo "Current Affairs JSON is already up to date."
          else
            git commit -m "Update Current Affairs JSON"
            git push
          fi
